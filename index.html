<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Skyrim True Believer 3.0 — Интерактивная карта вики</title>
  <meta name="description" content="Полная интерактивная карта и база данных по сборке Skyrim True Believer (STB 3.0): механики, ветки способностей, уникальные предметы, магия, аэдра и даэдра.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/img/image4.png">
</head>
<body>

<!-- 2D Infinite Constellation Map Viewport -->
<div id="vp">
  <div id="world">
    <svg id="links"></svg>
    <!-- Island cards generated dynamically -->
  </div>
</div>

<!-- Top Control Bar -->
<div id="bar">
  <div class="search-wrap">
    <input id="q" type="search" placeholder="Поиск по разделам и предметам…" aria-label="Поиск по вики">
    <div id="searchDropdown" class="search-dropdown" style="display: none;"></div>
  </div>
  <div class="bar-btn-group">
    <button id="zoomIn" class="map-ctrl-btn" title="Приблизить карту">+</button>
    <button id="zoomOut" class="map-ctrl-btn" title="Отдалить карту">−</button>
    <button id="home" class="map-ctrl-btn" title="Вся карта">Вся карта</button>
  </div>
</div>

<!-- Navigation Hint -->
<div id="hint">Тяните, чтобы двигаться. Колесо мыши или щипок — зум. Нажмите на раздел, чтобы исследовать</div>

<!-- Bottom Navigation Bar (Runic Pills) -->
<div id="nav"></div>

<!-- Section Shrine Modal Overlay -->
<div id="shrineOverlay" class="shrine-overlay" style="display: none;" aria-hidden="true">
  <div class="shrine-modal" id="shrineModal" style="--col: var(--gold);">
    <button class="shrine-close-btn" id="shrineCloseBtn" aria-label="Закрыть раздел">
      <span class="close-icon">✕</span>
      <span class="close-label">К карте</span>
      <kbd>ESC</kbd>
    </button>
    
    <div class="shrine-header">
      <b class="rn" id="shrineRune">ᛟ</b>
      <h2 id="shrineTitle">STB 3.0</h2>
      <i class="rule"></i>
      <div id="shrineBadgeWrap">
        <span class="n" id="shrineBadge"></span>
      </div>
    </div>
    
    <div class="shrine-body" id="viewContent">
      <!-- Section view content rendered here -->
    </div>
  </div>
</div>

<!-- Toast Container for Notifications -->
<div id="toastContainer" class="toast-container"></div>

<script src="assets/js/app.js"></script>
</body>
</html>
